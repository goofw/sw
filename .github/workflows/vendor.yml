name: vendor

on:
  workflow_dispatch:
  schedule:
    - cron: '44 4 * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: "vendor"
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - run: |
          url=$(curl -x http://195.158.8.123:3128 -fsSL https://pstream.mov | grep -oE "\/assets\/vendor\-.+\.js")
          curl -x http://195.158.8.123:3128 -fsSL "https://pstream.mov$url" > new.js
          grep xprime new.js >/dev/null || rm new.js
          [ -f new.js ] && { npm -g install js-beautify; js-beautify new.js > vendor.js; }

          git config user.name $(git log -1 --pretty=format:'%an')
          git config user.email $(git log -1 --pretty=format:'%ae')
          git add .
          git diff-index --quiet HEAD || git commit -m "update"
          git push
